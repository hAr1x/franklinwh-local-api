[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh_local_api"
version = "0.1.0"
description = "Fully local (LAN-only) async Python client for the FranklinWH aGate over Modbus TCP"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "hAr1x" },
]
dependencies = [
    "pymodbus>=3.6.0",
]
keywords = ["franklinwh", "battery", "modbus", "energy", "solar", "local", "homeassistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/hAr1x/franklinwh-local-api"
Repository = "https://github.com/hAr1x/franklinwh-local-api"
Issues = "https://github.com/hAr1x/franklinwh-local-api/issues"
Changelog = "https://github.com/hAr1x/franklinwh-local-api/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
include = ["franklinwh_local_api*"]
